services:
  localissuer:
    build:
      context: .
      target: localissuer
    networks:
      default:
        aliases:
          - local-issuer
    volumes:
      - ./config/certs/local-issuer.crt:/certs/local-issuer.crt:ro
      - ./config/certs/local-issuer.key:/certs/local-issuer.key:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - --no-check-certificate
        - https://127.0.0.1:8443/.well-known/jwks.json
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  mockmulesoft:
    build:
      context: .
      target: mockmulesoft
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8081/api/participants/P001
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 5s

  api:
    environment:
      SSL_CERT_FILE: /certs/ca-bundle.crt
    volumes:
      - ./config/certs/ca-bundle.crt:/certs/ca-bundle.crt:ro
    depends_on:
      localissuer:
        condition: service_healthy
      mockmulesoft:
        condition: service_healthy